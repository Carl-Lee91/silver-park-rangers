<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#80c4ee" />
    <title>연결 안 됨 · Silver Park Rangers</title>
    <!-- 인터넷이 끊겼을 때 서비스 워커(sw.js)가 보이는 화면. 다른 파일 없이 혼자 그려진다. 색은 globals.css 토큰과 같다 -->
    <style>
      body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; background: #0b1016; color: #e9eef4;
        font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
        word-break: keep-all; }
      header { background: #80c4ee; color: #0f2a44; padding: 12px 16px; }
      header p { margin: 0; font-size: 12px; font-weight: 600; }
      header h1 { margin: 2px 0 0; font-size: 18px; font-weight: 800; }
      main { flex: 1; padding: 16px; max-width: 30rem; width: 100%; box-sizing: border-box; margin: 0 auto; }
      section { border: 1px solid #263040; border-radius: 6px; background: #131a23; padding: 16px; }
      p { line-height: 1.6; }
      .muted { color: #a3aebc; font-size: 14px; }
      button { width: 100%; height: 48px; margin-top: 12px; border: 0; border-radius: 6px; background: #80c4ee; color: #0f2a44;
        font: inherit; font-size: 16px; font-weight: 700; }
    </style>
  </head>
  <body>
    <header>
      <p>Silver Park Rangers</p>
      <h1>연결 안 됨</h1>
    </header>
    <main>
      <section>
        <p><strong>인터넷에 연결되지 않았어요.</strong></p>
        <p class="muted">와이파이나 데이터를 켠 뒤 다시 시도해 주세요. 투표 · 스쿼드는 연결돼야 보여요.</p>
        <button type="button" onclick="location.reload()">다시 시도</button>
      </section>
    </main>
  </body>
</html>
