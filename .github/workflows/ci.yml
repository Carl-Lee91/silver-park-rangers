# 푸시·PR 마다 CLAUDE.md "구현 완료 후 필수 프로세스"를 돌린다.
# 배포(빌드)는 Vercel 이 Git 연동으로 따로 한다 — 여기서는 검사만 한다.
# 공개 저장소라 GitHub Actions 표준 러너는 무료·무제한이다.
name: CI

on:
  push:
    branches: [dev, main]
  pull_request:

# 같은 브랜치에 새로 푸시하면 앞의 검사는 멈춘다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # 버전은 package.json 의 packageManager 에서 읽는다.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # 러너에 깔린 Postgres 로 마이그레이션 + RLS 시나리오를 검사한다(Docker 불필요).
      - name: pnpm db:verify
        run: PG_BIN="$(ls -d /usr/lib/postgresql/*/bin | sort -V | tail -1)" pnpm db:verify
